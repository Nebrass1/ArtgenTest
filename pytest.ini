[pytest]
# Configuration Pytest pour Artygen

# Django settings
DJANGO_SETTINGS_MODULE = artify.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options d'affichage
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=accounts
    --cov-report=html
    --cov-report=term-missing

# Markers personnalisés
markers =
    auth: Tests d'authentification
    ui: Tests d'interface utilisateur (Selenium)
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents
    compatibility: Tests de compatibilité multi-navigateurs
    security: Tests de sécurité

# Dossiers à ignorer
norecursedirs = .git .tox venv env staticfiles media